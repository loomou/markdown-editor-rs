name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # macOS .app bundle 标识符，可按需修改
  BUNDLE_ID: dev.markdown-editor-rs.app

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          # 在 ARM runner 上交叉编译 Intel 版本
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Verify tag matches manifest version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::tag v$TAG_VERSION does not match Cargo.toml version $MANIFEST_VERSION"
            exit 1
          fi

      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo docker image prune -af || true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang libclang-dev pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libx11-dev libxcb1-dev libfreetype-dev libfontconfig1-dev

      - uses: dtolnay/rust-toolchain@1.96
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        env:
          # 静态链接 CRT，发布包不依赖 VCRUNTIME140.dll
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build (macOS / Linux)
        if: runner.os != 'Windows'
        run: cargo build --release --locked --target ${{ matrix.target }}

      # ---------- 打包 ----------
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $VERSION = $env:GITHUB_REF_NAME.TrimStart("v")
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "target/${{ matrix.target }}/release/markdown-editor-rs.exe" `
            -DestinationPath "dist/markdown-editor-rs-$VERSION-${{ matrix.target }}.zip"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          APP="Markdown Editor RS.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "target/${{ matrix.target }}/release/markdown-editor-rs" "$APP/Contents/MacOS/markdown-editor-rs"
          cp crates/md-editor/resources/macos/app-icon.icns "$APP/Contents/Resources/app-icon.icns"
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>Markdown Editor RS</string>
            <key>CFBundleDisplayName</key>
            <string>Markdown Editor RS</string>
            <key>CFBundleExecutable</key>
            <string>markdown-editor-rs</string>
            <key>CFBundleIdentifier</key>
            <string>$BUNDLE_ID</string>
            <key>CFBundleVersion</key>
            <string>$VERSION</string>
            <key>CFBundleShortVersionString</key>
            <string>$VERSION</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleIconFile</key>
            <string>app-icon</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF
          ditto -c -k --sequesterRsrc --keepParent "$APP" \
            "dist/markdown-editor-rs-$VERSION-${{ matrix.target }}.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          tar -czf "dist/markdown-editor-rs-$VERSION-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" markdown-editor-rs

      - uses: actions/upload-artifact@v5
        with:
          name: markdown-editor-rs-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v5
        with:
          pattern: markdown-editor-rs-*
          path: dist
          merge-multiple: true

      - name: Build the release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$(git tag --list 'v*' | sort -V | awk -v t="$GITHUB_REF_NAME" 'NR > 1 && $0 == t { print p; exit } { p = $0 }')
          args=(--method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME")
          if [ -n "$previous" ]; then
            args+=(-f previous_tag_name="$previous")
          fi
          gh api "${args[@]}" --jq .body \
            | sed -E \
                -e 's| by @[^ ]+ in | in |' \
                -e 's|^(\* )@|\1|' \
                -e 's| in (https://[^ ]*/pull/([0-9]+))$| ([#\2](\1))|' \
            > release-notes.md
          cat release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          body_path: release-notes.md
