[package]
name = "md-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
md-core = { workspace = true }
md-layout = { workspace = true }
md-theme = { workspace = true }
md-content = { workspace = true }

gpui = { workspace = true }

[features]
# Lets a benchmark force the prefetch window instead of the default, so the
# number of screens kept on each side can be swept. Off in every shipped build.
bench-support = []

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
