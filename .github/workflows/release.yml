name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # macOS .app bundle 标识符，可按需修改
  BUNDLE_ID: dev.md-editor.app

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          # 在 ARM runner 上交叉编译 Intel 版本
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang libclang-dev pkg-config \
            libxkbcommon-dev libwayland-dev libvulkan-dev \
            libx11-dev libxcb1-dev libfreetype-dev libfontconfig1-dev

      - uses: dtolnay/rust-toolchain@1.96
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix: release-${{ matrix.target }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        env:
          # 静态链接 CRT，发布包不依赖 VCRUNTIME140.dll
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build (macOS / Linux)
        if: runner.os != 'Windows'
        run: cargo build --release --locked --target ${{ matrix.target }}

      # ---------- 打包 ----------
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $VERSION = $env:GITHUB_REF_NAME.TrimStart("v")
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "target/${{ matrix.target }}/release/md-editor.exe" `
            -DestinationPath "dist/md-editor-$VERSION-${{ matrix.target }}.zip"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          APP="md-editor.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "target/${{ matrix.target }}/release/md-editor" "$APP/Contents/MacOS/md-editor"
          cp crates/md-editor/resources/macos/app-icon.icns "$APP/Contents/Resources/app-icon.icns"
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>md-editor</string>
            <key>CFBundleDisplayName</key>
            <string>md-editor</string>
            <key>CFBundleExecutable</key>
            <string>md-editor</string>
            <key>CFBundleIdentifier</key>
            <string>$BUNDLE_ID</string>
            <key>CFBundleVersion</key>
            <string>$VERSION</string>
            <key>CFBundleShortVersionString</key>
            <string>$VERSION</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleIconFile</key>
            <string>app-icon</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF
          ditto -c -k --sequesterRsrc --keepParent "$APP" \
            "dist/md-editor-$VERSION-${{ matrix.target }}.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          tar -czf "dist/md-editor-$VERSION-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" md-editor

      - uses: actions/upload-artifact@v4
        with:
          name: md-editor-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: md-editor-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
