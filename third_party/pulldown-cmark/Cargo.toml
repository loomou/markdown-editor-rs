[package]
name = "pulldown-cmark"
version = "0.13.4"
authors = [
    "Raph Levien <raph.levien@gmail.com>",
    "Marcus Klaas de Vries <mail@marcusklaas.nl>",
]
license = "MIT"
description = "A pull parser for CommonMark"
repository = "https://github.com/raphlinus/pulldown-cmark"
keywords = ["markdown", "commonmark"]
categories = ["text-processing"]
edition = "2021"
rust-version = "1.71.1" # Update README.md, CONTRIBUTING.md, and GitHub action when changing this
exclude = [
    "/third_party/**/*",
    "/tools/**/*",
    "/specs/**/*",
    "/azure-pipelines.yml",
]

build = "build.rs"

[[bin]]
name = "pulldown-cmark"
required-features = ["getopts"]
doc = false

[[example]]
name = "event-filter"
required-features = ["html"]
doc-scrape-examples = true

[[example]]
name = "footnote-rewrite"
required-features = ["html"]
doc-scrape-examples = true

[[example]]
name = "parser-map-event-print"
required-features = ["html"]
doc-scrape-examples = true

[[example]]
name = "parser-map-tag-print"
required-features = ["html"]
doc-scrape-examples = true

[[example]]
name = "string-to-string"
required-features = ["html"]
doc-scrape-examples = true

[[example]]
name = "broken-link-callbacks"
required-features = ["html"]
doc-scrape-examples = true

[[example]]
name = "normalize-wikilink"
required-features = ["html"]
doc-scrape-examples = true

[dependencies]
bitflags = "2"
unicase = "2.6"
memchr = "2.5"
getopts = { version = "0.2", optional = true }
serde = { version = "1.0", optional = true, features = ["derive"] }
pulldown-cmark-escape = { version = "0.11", optional = true }

[dev-dependencies]
lazy_static = "1.4"
regex = "1.6"
serde_json = "1.0.61"
bincode = "1.3.1"

[features]
default = ["getopts", "html"]
# Read-only access to the parse tree (`Parsed` / `NodeRef`), see src/tree_api.rs.
tree = []
# Two deviations from CommonMark, both of them about what a blank line ends. A blank
# line between two items of the same list is a list boundary instead of a loose list, and
# a line that is nothing but `$$` opens a display math block that runs to the next such
# line, blank lines included. Off by default, so `tests/suite/` keeps asserting CommonMark;
# sixteen cases there fail when it is on -- fifteen that spell a loose list with a blank
# line, plus `math::math_test_19`, which expects the `$$` fence to fall apart into four
# paragraphs. This repository builds the crate with it on.
editor-mode = []
gen-tests = []
simd = ["pulldown-cmark-escape?/simd"]
html = ["pulldown-cmark-escape"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(rustbuild)'] }
